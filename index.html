<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>首爾氣候卡 7日記帳本 (匯出匯入版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-12">

  <!-- 頂部 Header -->
  <div class="sticky top-0 z-50 bg-blue-600 text-white p-3 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-base font-bold">🇰🇷 氣候卡 7日離線記帳本</h1>
      <p class="text-[10px] text-blue-100">支援離線儲存 ➔ 匯出/匯入備份</p>
    </div>
    <!-- 匯出與匯入按鈕 -->
    <div class="flex gap-1">
      <button onclick="exportData()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-2.5 py-1.5 rounded-lg border border-blue-400 font-medium">
        📤 匯出行程
      </button>
      <button onclick="triggerImport()" class="bg-blue-800 hover:bg-blue-900 text-white text-xs px-2.5 py-1.5 rounded-lg border border-blue-400 font-medium">
        📥 匯入行程
      </button>
      <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. 氣候卡剩餘天數倒數卡片 -->
    <div id="countdownCard" class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-4 rounded-xl shadow-md space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs text-slate-400 font-semibold uppercase">🎫 氣候卡效期倒數</span>
        <span id="remainingDaysBadge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500 text-white">使用中</span>
      </div>
      
      <div class="flex justify-between items-baseline pt-1">
        <div>
          <p class="text-2xl font-black text-amber-400" id="remainingDaysText">7 天 0 小時</p>
          <p class="text-[11px] text-slate-300" id="dateRangeText">啟用日期：未設定</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-400">7日票成本</p>
          <p class="text-sm font-bold text-white">₩20,000</p>
        </div>
      </div>

      <!-- 進度條 -->
      <div class="w-full bg-slate-700 rounded-full h-2 mt-2">
        <div id="progressBar" class="bg-amber-400 h-2 rounded-full transition-all duration-500" style="width: 100%"></div>
      </div>
    </div>

    <!-- 2. 開卡日期設定 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">🗓️ 7日票 開卡日期設定</label>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">啟用日期</label>
          <input type="date" id="startDate" onchange="onStartDateChange()" class="w-full border rounded-lg p-2 text-xs bg-slate-50 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">到期日期</label>
          <input type="text" id="endDateDisplay" readonly disabled value="---" class="w-full border rounded-lg p-2 text-xs bg-slate-100 font-bold text-slate-600">
        </div>
      </div>
    </div>

    <!-- 3. 新增行程表單 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-sm text-slate-800 flex items-center gap-1">➕ 新增搭乘行程</h2>
        <span class="text-[10px] bg-blue-100 text-blue-800 font-bold px-1.5 py-0.5 rounded">自動記憶地點</span>
      </div>

      <!-- 動態下拉式選單 (自動加入新地點) -->
      <datalist id="stationList"></datalist>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">搭乘日期</label>
          <input type="date" id="tripDate" class="w-full border rounded-lg p-2 text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">起點</label>
          <input type="text" id="fromLoc" list="stationList" placeholder="例: 鍾路五街" oninput="autoEstimateFare()" class="w-full border rounded-lg p-2 text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">終點</label>
          <input type="text" id="toLoc" list="stationList" placeholder="例: 聖水" oninput="autoEstimateFare()" class="w-full border rounded-lg p-2 text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">預估車資 (KRW)</label>
          <input type="number" id="estimatedFare" value="1550" class="w-full border rounded-lg p-2 text-sm bg-slate-50 font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">轉乘優惠</label>
          <select id="isTransfer" onchange="autoEstimateFare()" class="w-full border rounded-lg p-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="false">🆕 新搭乘 (₩1550+)</option>
            <option value="true">🔄 30分內轉乘 (免費)</option>
          </select>
        </div>
      </div>

      <button onclick="addTrip()" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition-all">
        新增行程 (自動記錄地點)
      </button>
    </div>

    <!-- 4. 行程清單 -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-sm text-slate-800">📋 行程總表</h3>
        <button onclick="clearTrips()" class="text-xs text-red-500 font-semibold">清空所有行程</button>
      </div>

      <div id="tripList" class="space-y-2 text-sm max-h-60 overflow-y-auto pr-1">
        <p class="text-xs text-slate-400 text-center py-4">目前尚無紀錄</p>
      </div>
    </div>

    <!-- 5. 車資試算結算卡片 -->
    <div id="resultCard" class="bg-slate-800 text-white p-5 rounded-2xl shadow-lg space-y-3">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs text-slate-400 font-semibold uppercase">7日票 試算結果</p>
          <h3 id="recommendation" class="text-lg font-bold text-amber-400">請新增行程開始試算</h3>
        </div>
        <span id="badge" class="bg-slate-700 text-slate-300 text-[10px] px-2 py-1 rounded-full">等待紀錄</span>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700 text-center">
        <div class="bg-slate-700/50 p-2 rounded-lg">
          <p class="text-[10px] text-slate-400">一般卡累積車資</p>
          <p id="tmoneyCost" class="text-base font-bold">₩0</p>
        </div>
        <div class="bg-slate-700/50 p-2 rounded-lg">
          <p class="text-[10px] text-slate-400">氣候卡 7日券價格</p>
          <p id="climateCost" class="text-base font-bold">₩20,000</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 預設熱門站點
    const defaultStations = [
      "鍾路五街 (廣藏市場)", "明洞", "弘大入口", "聖水", "江南", 
      "狎鷗亭羅德奧", "新沙 (林蔭大道)", "東大門", "安國 (北村)", 
      "景福宮", "蠶室", "梨泰院", "首爾站", "汝矣島"
    ];

    let appState = {
      startDate: new Date().toISOString().split('T')[0],
      customStations: [], // 儲存使用者自訂輸入過的地點
      trips: []
    };

    const routeFareDb = {
      "鍾路五街 (廣藏市場)-明洞": 1550,
      "鍾路五街 (廣藏市場)-聖水": 1550,
      "鍾路五街 (廣藏市場)-江南": 1650,
      "明洞-聖水": 1650,
      "明洞-江南": 1650,
      "弘大入口-聖水": 1650
    };

    window.onload = function() {
      loadLocalState();
      document.getElementById('tripDate').value = appState.startDate;
      renderAll();
    };

    function saveLocalState() {
      localStorage.setItem('climateAppState_v2', JSON.stringify(appState));
    }

    function loadLocalState() {
      const saved = localStorage.getItem('climateAppState_v2');
      if (saved) {
        try { appState = JSON.parse(saved); } catch (e) {}
      }
    }

    function onStartDateChange() {
      appState.startDate = document.getElementById('startDate').value;
      saveLocalState();
      renderAll();
    }

    // 自動預估車資
    function autoEstimateFare() {
      const from = document.getElementById('fromLoc').value.trim();
      const to = document.getElementById('toLoc').value.trim();
      const isTransfer = document.getElementById('isTransfer').value === 'true';
      const fareInput = document.getElementById('estimatedFare');

      if (isTransfer) {
        fareInput.value = 0;
        return;
      }

      const key = `${from}-${to}`;
      const rKey = `${to}-${from}`;
      fareInput.value = routeFareDb[key] || routeFareDb[rKey] || 1550;
    }

    // 新增地點至選單 (過濾重複)
    function rememberStation(stationName) {
      if (!stationName) return;
      const cleanName = stationName.trim();
      if (!defaultStations.includes(cleanName) && !appState.customStations.includes(cleanName)) {
        appState.customStations.push(cleanName);
      }
    }

    // 新增行程
    function addTrip() {
      const tripDate = document.getElementById('tripDate').value;
      const fromLoc = document.getElementById('fromLoc').value.trim() || '未指定';
      const toLoc = document.getElementById('toLoc').value.trim() || '未指定';
      const fare = parseInt(document.getElementById('estimatedFare').value) || 0;
      const isTransfer = document.getElementById('isTransfer').value === 'true';

      // 自動記憶輸入過的地點
      rememberStation(fromLoc);
      rememberStation(toLoc);

      appState.trips.push({
        date: tripDate,
        from: fromLoc,
        to: toLoc,
        fare: fare,
        isTransfer: isTransfer
      });

      appState.trips.sort((a, b) => new Date(a.date) - new Date(b.date));

      saveLocalState();
      renderAll();

      document.getElementById('fromLoc').value = '';
      document.getElementById('toLoc').value = '';
      document.getElementById('isTransfer').value = 'false';
      autoEstimateFare();
    }

    function removeTrip(index) {
      appState.trips.splice(index, 1);
      saveLocalState();
      renderAll();
    }

    function clearTrips() {
      if (confirm("確定要清空所有行程與紀錄？")) {
        appState.trips = [];
        saveLocalState();
        renderAll();
      }
    }

    // 📤 匯出 JSON 檔案
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `韓國氣候卡行程_${appState.startDate}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 📥 觸發匯入
    function triggerImport() {
      document.getElementById('importFileInput').click();
    }

    // 📥 讀取並匯入檔案
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData.trips && Array.isArray(importedData.trips)) {
            appState = importedData;
            saveLocalState();
            renderAll();
            alert("✅ 行程資料已成功匯入！");
          } else {
            alert("❌ 檔案格式不正確");
          }
        } catch (err) {
          alert("❌ 讀取檔案失敗，請確認是否為正確的 JSON 檔案");
        }
      };
      reader.readAsText(file);
    }

    // 渲染 UI (更新倒數、選單、行程表與車資)
    function renderAll() {
      // 1. 更新開卡與到期日倒數
      document.getElementById('startDate').value = appState.startDate;
      
      const startDate = new Date(appState.startDate);
      const endDate = new Date(startDate);
      endDate.setDate(startDate.getDate() + 6);

      const startStr = appState.startDate;
      const endStr = endDate.toISOString().split('T')[0];
      document.getElementById('endDateDisplay').value = endStr;
      document.getElementById('dateRangeText').innerText = `使用期間：${startStr} ~ ${endStr}`;

      const now = new Date();
      const expirationDate = new Date(endDate);
      expirationDate.setHours(23, 59, 59);

      const diffTime = expirationDate - now;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const diffHours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

      const remainingText = document.getElementById('remainingDaysText');
      const badge = document.getElementById('remainingDaysBadge');
      const progressBar = document.getElementById('progressBar');

      if (diffTime < 0) {
        remainingText.innerText = "已過期";
        remainingText.className = "text-2xl font-black text-red-400";
        badge.innerText = "已失效";
        badge.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-red-500 text-white";
        progressBar.style.width = "0%";
      } else {
        remainingText.innerText = `${diffDays} 天 ${diffHours} 小時`;
        remainingText.className = "text-2xl font-black text-amber-400";
        badge.innerText = "使用中";
        badge.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500 text-white";
        const pct = Math.max(0, Math.min(100, (diffTime / (7 * 24 * 60 * 60 * 1000)) * 100));
        progressBar.style.width = `${pct}%`;
      }

      // 2. 更新下拉式選單 (組合預設 + 使用者輸入過的地點，自動去重)
      const stationListEl = document.getElementById('stationList');
      const allStations = Array.from(new Set([...defaultStations, ...appState.customStations]));
      stationListEl.innerHTML = allStations.map(s => `<option value="${s}"></option>`).join('');

      // 3. 更新行程清單
      const listEl = document.getElementById('tripList');
      if (appState.trips.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">目前尚無紀錄</p>`;
      } else {
        let html = '';
        appState.trips.forEach((trip, index) => {
          html += `
            <div class="flex justify-between items-center p-2 rounded-lg bg-slate-50 border border-slate-100 text-xs">
              <div class="overflow-hidden">
                <div class="flex items-center gap-1 mb-0.5">
                  <span class="text-[10px] text-slate-400 font-mono">${trip.date || '未指定'}</span>
                  <span class="${trip.isTransfer ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'} text-[9px] font-bold px-1 rounded">
                    ${trip.isTransfer ? '轉乘' : '直搭'}
                  </span>
                </div>
                <p class="truncate font-medium text-slate-700">${trip.from} ➔ ${trip.to}</p>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="font-bold text-slate-800">₩${trip.fare.toLocaleString()}</span>
                <button onclick="removeTrip(${index})" class="text-slate-400 hover:text-red-500 font-bold text-sm px-1">✕</button>
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;
      }

      // 4. 車資試算結算
      const climateTotal = 20000;
      const totalTMoney = appState.trips.reduce((sum, t) => sum + t.fare, 0);

      document.getElementById('tmoneyCost').innerText = `₩${totalTMoney.toLocaleString()}`;
      document.getElementById('climateCost').innerText = `₩${climateTotal.toLocaleString()}`;

      const recommendationEl = document.getElementById('recommendation');
      const badgeEl = document.getElementById('badge');

      if (appState.trips.length === 0) {
        recommendationEl.innerText = "請新增行程開始試算";
        badgeEl.innerText = "等待紀錄";
        return;
      }

      const diff = Math.abs(totalTMoney - climateTotal);
      if (totalTMoney > climateTotal) {
        recommendationEl.innerText = `買 7 日卡超划算！省下 ₩${diff.toLocaleString()}`;
        recommendationEl.className = "text-lg font-bold text-emerald-400";
        badgeEl.innerText = "成功保本！";
        badgeEl.className = "bg-emerald-500 text-white text-[10px] px-2 py-1 rounded-full font-bold";
      } else {
        recommendationEl.innerText = `還差 ₩${diff.toLocaleString()} 保本`;
        recommendationEl.className = "text-lg font-bold text-amber-300";
        badgeEl.innerText = "尚未回本";
        badgeEl.className = "bg-amber-500 text-white text-[10px] px-2 py-1 rounded-full font-bold";
      }
    }
  </script>
</body>
</html>
